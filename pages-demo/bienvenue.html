<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bienvenue — Espace propriétaire Lyze</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@300;400&family=Gloock&family=Instrument+Sans:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=27">
  <script src="assets/js/main.js?v=27" defer></script>
</head>
<body>
  <!-- Copie statique de /espace/bienvenue (fiche de première connexion) pour GitHub Pages : démo, rien n'est enregistré. -->
  <main class="connexion">
    <a class="fermer-connexion" href="index.html" aria-label="Retour au site"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" d="M5 5l14 14M19 5L5 19"/></svg></a>
    <div class="connexion-visuel">
      <img src="https://images.unsplash.com/photo-1505577058444-a3dab90d4253?w=1600&q=80&auto=format&fit=crop" alt="" fetchpriority="high">
      <a class="logo" href="index.html"><img src="assets/img/logo-lyze-creme.png" alt="Lyze Conciergerie" width="599" height="200"></a>
      <blockquote>Votre bien, entre de bonnes mains.</blockquote>
    </div>

    <form class="connexion-form bienvenue-form" novalidate>
      <span class="eyebrow eyebrow--brique">Première connexion</span>
      <h1>Bienvenue.</h1>
      <p class="lead">Quelques informations pour que Lyze puisse vous joindre et vous adresser vos comptes rendus. Une seule fois : vous accédez ensuite à votre espace.</p>

      <label class="champ"><span>Téléphone</span>
        <span class="tel-groupe">
          <select name="indicatif" data-indicatifs aria-label="Indicatif du pays"><option value="+212">Maroc (+212)</option></select>
          <input name="numero" type="tel" autocomplete="tel-national" placeholder="6 12 34 56 78" required aria-label="Numéro">
        </span>
      </label>
      <label class="champ"><span>E-mail</span><input type="email" name="email" autocomplete="email" required></label>
      <label class="champ"><span>Adresse postale</span><input name="address" autocomplete="street-address" required placeholder="Rue, code postal, ville"></label>
      <label class="champ"><span>Pays de résidence</span><input name="country" autocomplete="country-name" required placeholder="Maroc"></label>
      <fieldset class="champ choix-contact">
        <span>Comment préférez-vous être contacté·e ?</span>
        <label><input type="radio" name="contactPreference" value="WhatsApp" checked>WhatsApp</label>
        <label><input type="radio" name="contactPreference" value="Téléphone">Téléphone</label>
        <label><input type="radio" name="contactPreference" value="E-mail">E-mail</label>
      </fieldset>

      <p class="erreur" role="alert" hidden>Remplissez tous les champs.</p>
      <button class="btn btn--plein" type="submit">Accéder à mon espace</button>
    </form>
  </main>
  <script>
    // Démo : vérifie juste que les champs sont remplis, puis ouvre l'espace.
    var form = document.querySelector('.bienvenue-form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var ok = form.checkValidity();
      form.querySelector('.erreur').hidden = ok;
      if (!ok) return;
      try { localStorage.setItem('lyze-demo-bienvenue', '1'); } catch (err) {}
      location.href = 'espace.html';
    });
  </script>
</body>
</html>
