# GitHub Pages = simple renvoi vers le site complet sur Vercel (lyze-conciergerie.vercel.app), même page conservée.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Une seule adresse : toute page de l'ancien lien GitHub renvoie vers la même page du site complet sur Vercel
      # (404.html est servi par Pages pour n'importe quel chemin, index.html pour la racine).
      - run: |
          mkdir _site
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="fr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="robots" content="noindex">
          <title>Lyze Conciergerie</title>
          <link rel="canonical" href="https://lyze-conciergerie.vercel.app/">
          <meta http-equiv="refresh" content="0; url=https://lyze-conciergerie.vercel.app/">
          <script>
            var chemin = location.pathname.replace(/^\/lyze-vitrine/, "") || "/";
            location.replace("https://lyze-conciergerie.vercel.app" + chemin + location.search + location.hash);
          </script>
          </head><body><p><a href="https://lyze-conciergerie.vercel.app/">Lyze Conciergerie</a></p></body></html>
          EOF
          cp _site/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
