# Publie la vitrine statique (public/) sur GitHub Pages en attendant l'hébergement Vercel.
# Le login (/connexion) ne marche pas sur Pages : il faut le serveur Next.js.
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Vitrine + connexion/espace de démo (pages-demo/) ; /connexion pointe vers la page statique.
      - run: |
          mkdir _site && cp -r public/. pages-demo/. _site/
          sed -i 's#href="/connexion"#href="connexion.html"#g' _site/*.html
          sed -i 's#href="/connexion"#href="../connexion.html"#g' _site/ar/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
