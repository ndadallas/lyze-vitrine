# Publie la vitrine statique (public/) sur GitHub Pages. Le login et l'espace propriétaire sont sur Vercel (lyze-conciergerie.vercel.app).
name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Vitrine statique ; « Espace propriétaire » (/connexion) pointe vers le vrai espace hébergé sur Vercel.
      - run: |
          mkdir _site && cp -r public/. _site/
          sed -i 's#href="/connexion"#href="https://lyze-conciergerie.vercel.app/connexion"#g' _site/*.html _site/{ar,en,it,es}/*.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
